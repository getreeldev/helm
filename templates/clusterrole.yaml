{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "reel.fullname" . }}
  labels:
    {{- include "reel.labels" . | nindent 4 }}
    app.kubernetes.io/component: forensics
rules:
- apiGroups: [""]
  resources: ["pods", "pods/exec", "nodes"]
  verbs: ["get", "list", "watch", "create", "delete"]
- apiGroups: [""]
  resources: ["nodes/status"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["nodes/proxy"]
  verbs: ["get", "create", "update", "patch"]
- apiGroups: [""]
  resources: ["pods/checkpoint"]
  verbs: ["create"]
- apiGroups: [""]
  resources: ["nodes/checkpoint"]
  verbs: ["create"]
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch"]
# Secrets: get-by-name only. The agent fetches a user-referenced backup
# credentials secret by name (or falls back to IRSA) — it never lists or
# watches secrets, so it cannot enumerate/dump cluster secrets even if
# compromised. Self-service backup config (any namespace) still works.
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "daemonsets", "replicasets"]
  verbs: ["get", "list", "watch", "update", "patch"]
{{- end }}
