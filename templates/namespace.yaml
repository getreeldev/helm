{{- /*
Auto-create the install namespace so `helm install reel oci://docker.io/getreel/helm -n reel`
works on a fresh cluster without requiring `--create-namespace`. resource-policy: keep
prevents `helm uninstall` from deleting the namespace (which would take all forensic
artifacts with it).

Disable with `--set namespace.create=false` if a cluster admin pre-creates the namespace.
*/ -}}
{{- if .Values.namespace.create -}}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Release.Namespace }}
  annotations:
    "helm.sh/resource-policy": keep
{{- end -}}
