name: Helm

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Helm lint
        run: helm lint .

      - name: Helm template
        run: helm template reel . --debug

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | helm registry login docker.io -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin

      - name: Package and push
        run: |
          helm package .
          helm push helm-*.tgz oci://docker.io/getreel
