name: Helm

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Helm lint
        run: helm lint .

      - name: Helm template
        run: helm template reel . --debug

      - name: Security invariants
        run: |
          set -euo pipefail
          # Secrets RBAC must stay get-only (no list/watch) — the agent fetches
          # a named backup-credentials secret, it must never enumerate secrets.
          sec=$(helm template reel . | awk '/resources: \["secrets"\]/{getline; print}')
          echo "secrets verbs: $sec"
          echo "$sec" | grep -q 'verbs: \["get"\]' \
            || { echo "FAIL: secrets RBAC is not get-only"; exit 1; }
          if echo "$sec" | grep -qE 'list|watch'; then
            echo "FAIL: secrets RBAC granted list/watch (lets a compromised agent dump all secrets)"; exit 1
          fi
          # The NetworkPolicy (when enabled) must deny all ingress.
          helm template reel . --set networkPolicy.enabled=true | grep -q 'ingress: \[\]' \
            || { echo "FAIL: NetworkPolicy does not deny ingress"; exit 1; }
          echo "security invariants OK"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | helm registry login docker.io -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin

      - name: Package and push
        run: |
          helm package .

          # Gate: never publish a chart carrying repository metadata or a
          # credential. Chart 1.5.3 shipped .git/config with a release token in
          # it. .helmignore is what prevents it; this is what proves it, on both
          # publishers (this job and reel's publish-helm push the same tag).
          if tar -tzf helm-*.tgz | grep -qE '(^|/)\.git/'; then
            echo "::error::chart contains .git/ — refusing to publish"
            tar -tzf helm-*.tgz | grep -E '(^|/)\.git/' | head
            exit 1
          fi
          if tar -xzOf helm-*.tgz | grep -qaE 'gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|AUTHORIZATION: basic'; then
            echo "::error::chart contains something credential-shaped — refusing to publish"
            exit 1
          fi

          helm push helm-*.tgz oci://docker.io/getreel
